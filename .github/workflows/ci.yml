name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version
      - run: moon update
      - run: moon check
      - run: moon build
      - run: moon test
      - run: moon run examples/verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install biscuit-python==0.4.0
      - run: python tools/interop.py
