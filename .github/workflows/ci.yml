name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version
      - run: moon update
      - run: moon fmt --check
      - run: moon check
      - run: moon build
      - run: moon test
      - run: moon run examples/verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Check and build pinned biscuit-rust helper
        run: |
          cargo fmt --manifest-path tools/biscuit-rust-interop/Cargo.toml -- --check
          cargo test --manifest-path tools/biscuit-rust-interop/Cargo.toml
      - run: python tools/interop.py
