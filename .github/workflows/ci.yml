name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-toolchain)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn
      - run: moon build
      - run: moon test --deny-warn
      - run: moon test --target native --deny-warn
      - name: Validate official Biscuit samples
        run: moon test --deny-warn -f 'official*'
      - name: Verify generated MoonBit interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - run: moon run examples/verify
      - name: Validate authorization and inspection examples
        run: |
          moon run examples/authorize
          moon run examples/inspect
      - name: Validate maintenance delegation business case
        run: moon run examples/maintenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Check and build pinned biscuit-rust helper
        run: |
          cargo fmt --manifest-path tools/biscuit-rust-interop/Cargo.toml -- --check
          cargo test --manifest-path tools/biscuit-rust-interop/Cargo.toml
      - run: python tools/interop.py
      - name: Validate Rust-only P-256 and mixed-algorithm reference matrix
        run: cargo run --quiet --manifest-path tools/biscuit-rust-interop/Cargo.toml -- algorithm-matrix > _build/algorithm-reference.txt
      - name: Validate bidirectional P-256 and mixed-algorithm interoperability
        run: python tools/algorithm_interop.py
      - name: Preserve differential fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-decisions
          path: |
            _build/interop-decisions.json
            _build/algorithm-reference.txt
            _build/algorithm-interop.json
          if-no-files-found: ignore
          retention-days: 14
